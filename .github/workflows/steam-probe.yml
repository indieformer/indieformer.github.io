name: Steam API probe (one-off)

# Manual-only. Read-only discovery of what the partner WebAPI key can pull.
# Prints structure + unit counts to the log (no key, no USD). Delete after use.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe partner API
        env:
          STEAM_FINANCIAL_KEY: ${{ secrets.STEAM_FINANCIAL_KEY }}
          STEAM_PARNTER_KEY: ${{ secrets.STEAM_PARNTER_KEY }}
          STEAM_PARTNER_KEY: ${{ secrets.STEAM_PARTNER_KEY }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_WEB_API_KEY: ${{ secrets.STEAM_WEB_API_KEY }}
          STEAM_WEBAPI_KEY: ${{ secrets.STEAM_WEBAPI_KEY }}
          STEAMWORKS_API_KEY: ${{ secrets.STEAMWORKS_API_KEY }}
          STEAMWORKS_KEY: ${{ secrets.STEAMWORKS_KEY }}
          STEAM_PUBLISHER_KEY: ${{ secrets.STEAM_PUBLISHER_KEY }}
          STEAM_KEY: ${{ secrets.STEAM_KEY }}
          STEAM_SECRET: ${{ secrets.STEAM_SECRET }}
        run: python3 scripts/steam_probe.py
